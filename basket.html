<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Cost Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>
</head>
<body>

    <h1>Basket Cost Calculator</h1>

    <h2>Enter Basket Quantities (e.g., apple, banana, orange)</h2>
    <input type="text" id="userInput1" placeholder="Enter products separated by commas" />

    <h2>Enter Prices (e.g., 1.5, 0.5, 1.0 for each product above)</h2>
    <input type="text" id="userInput2" placeholder="Enter prices separated by commas" />

    <button onclick="calculateSum()">Calculate Total Cost</button>

    <h3 id="output"></h3>

    <script>
        alert("Loaded Basket JS");

        function calculateSum() {
            const inputText1 = document.getElementById("userInput1").value;
            const inputText2 = document.getElementById("userInput2").value;

            // Split the input strings and create the basket and prices objects
            const products = inputText1.split(',').map(item => item.trim());
            const pricesList = inputText2.split(',').map(item => parseFloat(item.trim()));

            const basket = {};
            const prices = {};

            products.forEach((product, index) => {
                basket[product] = Math.floor(Math.random() * 10) + 1; 
            });

            products.forEach((product, index) => {
                prices[product] = pricesList[index] || 0; 
            });

            const result = basketCost(basket, prices);
            document.getElementById("output").innerText = "Basket Cost is " + result;
        }

        const basketCost = (basket, prices) => {
            let totalCost = 0;

            for (let product in basket) {
                if (prices[product]) {
                    totalCost += basket[product] * prices[product];
                }
            }

            return totalCost;
        }
    </script>
</body>
</html>
